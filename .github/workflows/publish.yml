#
# Build and publish the image to GHCR as ghcr.io/<owner>/atrust-quadlet. Every push to main refreshes
# :latest and :main; a v* tag adds the version tags (:1.0.0, :1.0) and moves :latest to the release.
# The workflow can also be run by hand.
#
# Two images, both built with podman, in one package:
#
#   * the client image   base/Containerfile   -> <package>:base-<client version>-<recipe hash8>-<arch>
#   * this repository    Containerfile        -> <package>:<latest|main|sha|version>
#
# The client image is published because it changes much more slowly than this repository's code: the
# job checks whether its content-addressed tag already exists (`base/ref.sh` derives it from the
# client version and the recipe) and skips the whole build when it does, so an app-only change only
# builds the last layer. It stays in the same package as the app image because GHCR only grants
# GITHUB_TOKEN write access to packages linked to the repository.
#
# Both architectures build on their own native runner (ubuntu-26.04 / ubuntu-26.04-arm), each pushes
# its platform by digest under its own tag and the merge job assembles the manifest list. No buildx,
# no QEMU: the runner images ship podman, and podman does not need a daemon.

name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  base:
    name: base (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          version=$(sed -n 's/^ATRUST_VERSION=//p' "base/build-args/${arch}.args")
          echo "ATRUST_VERSION=$version" >> "$GITHUB_ENV"
          echo "BASE_REF=$REGISTRY/${GITHUB_REPOSITORY,,}:base-$(bash base/ref.sh "${arch}")" >> "$GITHUB_ENV"
        env:
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}

      - name: Log in to GHCR
        run: podman login "$REGISTRY" --username "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Check whether this client image already exists
        id: check
        run: |
          if podman manifest inspect "$BASE_REF" >/dev/null 2>&1; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "$BASE_REF is already published, skipping the build"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the client image
        if: steps.check.outputs.built == 'true'
        run: |
          podman build --pull=always \
            --build-arg-file "base/build-args/${{ matrix.arch }}.args" \
            --label org.opencontainers.image.title=atrust-base \
            --label "org.opencontainers.image.description=Sangfor aTrust client image: Debian 13, the vendor package and the container plumbing it expects (built by atrust-quadlet's base/)" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$ATRUST_VERSION" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$BASE_REF" \
            -f base/Containerfile base/
          podman push "$BASE_REF"

  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: base
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "BASE_REF=$REGISTRY/${GITHUB_REPOSITORY,,}:base-$(bash base/ref.sh "${arch}")" >> "$GITHUB_ENV"
        env:
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=atrust-quadlet
            org.opencontainers.image.description=The Sangfor aTrust client in a rootless podman container, with supervised auto-login
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Log in to GHCR
        run: podman login "$REGISTRY" --username "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push by digest
        id: build
        run: |
          labels=()
          while IFS= read -r label; do
            [ -n "$label" ] && labels+=(--label "$label")
          done <<< "$DOCKER_METADATA_OUTPUT_LABELS"
          podman build --pull=always \
            --build-arg BASE_IMAGE="$BASE_REF" \
            "${labels[@]}" \
            -t "$REGISTRY/$IMAGE_NAME:$PLATFORM_PAIR" \
            .
          podman push --digestfile "${{ runner.temp }}/digest" "$REGISTRY/$IMAGE_NAME:$PLATFORM_PAIR"

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          # podman writes the digest with its algorithm prefix; the merge job adds it back
          sed -E 's/^sha256://' "${{ runner.temp }}/digest" \
            > "${{ runner.temp }}/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest list
    runs-on: ubuntu-26.04
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        run: podman login "$REGISTRY" --username "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create the manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          podman manifest create "$image:merge"
          for digest in *; do
            podman manifest add "$image:merge" "$image@sha256:$(cat "$digest")"
          done
          for tag in "${tags[@]}"; do
            podman manifest push --all "$image:merge" "docker://$tag"
          done
          podman manifest inspect "${tags[0]}"
